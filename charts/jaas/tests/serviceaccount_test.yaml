suite: test jaas serviceaccount
templates:
  - serviceaccount.yaml
tests:
  - it: is empty by default
    asserts:
      - hasDocuments:
          count: 0

  - it: is empty when operator is enabled (the default) regardless enablement
    set:
      operator:
        enabled: true
      serviceAccount:
        enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: renders when operator is disabled and create is true
    set:
      operator:
        enabled: false
      serviceAccount:
        enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount

  - it: carries the jaas component label
    set:
      operator:
        enabled: false
      serviceAccount:
        enabled: true
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: jaas

  - it: uses the configured ServiceAccount name
    set:
      operator:
        enabled: false
      serviceAccount:
        enabled: true
        name: my-sa
    asserts:
      - equal:
          path: metadata.name
          value: my-sa

  - it: defaults the ServiceAccount name to jaas
    set:
      operator:
        enabled: false
      serviceAccount:
        enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: jaas

  - it: is not rendered when create is false
    set:
      operator:
        enabled: false
      serviceAccount:
        enabled: true
        create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: lives in the release namespace
    release:
      namespace: jaas-system
    set:
      operator:
        enabled: false
      serviceAccount:
        enabled: true
    asserts:
      - equal:
          path: metadata.namespace
          value: jaas-system

  - it: merges custom labels and annotations into metadata
    set:
      operator:
        enabled: false
      serviceAccount:
        enabled: true
        labels:
          customLabel: customValue
        annotations:
          customAnnotation: customValue
    asserts:
      - equal:
          path: metadata.labels.customLabel
          value: customValue
      - equal:
          path: metadata.annotations.customAnnotation
          value: customValue
