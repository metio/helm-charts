suite: test OCI-mount vs Flux mutual exclusion
templates:
  - templates/validate-modes.yaml
tests:
  - it: allows the standalone renderer with OCI snippet/library mounts
    set:
      operator.enabled: false
      snippets:
        dashboards: ghcr.io/metio/joi-grafana-grafonnet:v11.4.0
      additionalLibraries:
        grafonnet: ghcr.io/metio/joi-grafana-grafonnet:v11.4.0
    asserts:
      - hasDocuments:
          count: 0
  - it: allows Flux mode with no OCI mounts
    set:
      operator.enabled: true
      operator.defaultServiceAccount: default
    asserts:
      - hasDocuments:
          count: 0
  - it: rejects Flux mode combined with snippet OCI mounts
    set:
      operator.enabled: true
      operator.defaultServiceAccount: default
      snippets:
        dashboards: ghcr.io/metio/joi-grafana-grafonnet:v11.4.0
    asserts:
      - failedTemplate:
          errorMessage: "operator.enabled (Flux integration) is mutually exclusive with the static `snippets` OCI mount: in Flux mode the published units come from JsonnetSnippet CRs. Either clear `snippets`, or set operator.enabled=false (standalone renderer). OCI library mounts (`additionalLibraries`, `libraries`) are allowed in both modes."
  - it: allows Flux mode combined with library OCI mounts
    # The operator folds OCI-mounted libraries into its --library-path search
    # additively after JsonnetLibrary CR refs, so shared libraries can ship
    # cluster-wide via image volumes without a JsonnetLibrary CR per tenant.
    set:
      operator.enabled: true
      operator.defaultServiceAccount: default
      additionalLibraries:
        grafonnet: ghcr.io/metio/joi-grafana-grafonnet:v11.4.0
    asserts:
      - hasDocuments:
          count: 0
  - it: allows Flux mode combined with an enabled well-known library
    set:
      operator.enabled: true
      operator.defaultServiceAccount: default
      libraries.grafonnet.enabled: true
    asserts:
      - hasDocuments:
          count: 0
  - it: allows Flux mode with all well-known libraries disabled (default)
    set:
      operator.enabled: true
      operator.defaultServiceAccount: default
    asserts:
      - hasDocuments:
          count: 0
  # C3 — multi-replica + local storage fail-fast
  - it: rejects multi-replica operator on the local backend (emptyDir)
    set:
      operator.enabled: true
      operator.defaultServiceAccount: default
      replicas.max: 3
    asserts:
      - failedTemplate:
          errorMessage: "operator.enabled with more than one replica and operator.storage.backend=local serves stale 404s from non-leader pods — only the leader writes tarballs while the storage Service reads from every replica. Use operator.storage.backend=s3 (every replica reads the same bucket), or set operator.storage.persistence.enabled=true with an accessMode of ReadWriteMany (RWX) so every replica mounts the same volume."
  - it: rejects multi-replica operator on a local RWO PVC
    set:
      operator.enabled: true
      operator.defaultServiceAccount: default
      replicas.min: 2
      replicas.max: 2
      operator.storage.persistence.enabled: true
      operator.storage.persistence.accessModes:
        - ReadWriteOnce
    asserts:
      - failedTemplate:
          errorMessage: "operator.enabled with more than one replica and operator.storage.backend=local serves stale 404s from non-leader pods — only the leader writes tarballs while the storage Service reads from every replica. Use operator.storage.backend=s3 (every replica reads the same bucket), or set operator.storage.persistence.enabled=true with an accessMode of ReadWriteMany (RWX) so every replica mounts the same volume."
  - it: allows multi-replica operator on the S3 backend
    set:
      operator.enabled: true
      operator.defaultServiceAccount: default
      replicas.max: 3
      operator.storage.backend: s3
      operator.storage.s3.endpoint: minio.minio.svc:9000
      operator.storage.s3.bucket: jaas
    asserts:
      - hasDocuments:
          count: 0
  - it: allows multi-replica operator on a local RWX PVC
    set:
      operator.enabled: true
      operator.defaultServiceAccount: default
      replicas.max: 3
      operator.storage.persistence.enabled: true
      operator.storage.persistence.accessModes:
        - ReadWriteMany
    asserts:
      - hasDocuments:
          count: 0
  - it: allows single-replica operator on the local backend (default)
    set:
      operator.enabled: true
      operator.defaultServiceAccount: default
    asserts:
      - hasDocuments:
          count: 0
  # C4 — scaling with leader election off fail-fast
  - it: rejects scaling the operator with leader election off
    set:
      operator.enabled: true
      operator.defaultServiceAccount: default
      operator.storage.backend: s3
      operator.storage.s3.endpoint: minio.minio.svc:9000
      operator.storage.s3.bucket: jaas
      replicas.max: 3
      operator.leaderElection.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "operator.enabled with scaling (replicas.max > replicas.min, or replicas.min > 1) requires operator.leaderElection.enabled=true. Without leader election every replica reconciles every JsonnetSnippet independently, double-rendering and racing the ExternalArtifact write. Keep leader election on, or pin replicas.min=replicas.max=1."
  - it: rejects replicas.min > 1 with leader election off
    set:
      operator.enabled: true
      operator.defaultServiceAccount: default
      operator.storage.backend: s3
      operator.storage.s3.endpoint: minio.minio.svc:9000
      operator.storage.s3.bucket: jaas
      replicas.min: 2
      replicas.max: 2
      operator.leaderElection.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "operator.enabled with scaling (replicas.max > replicas.min, or replicas.min > 1) requires operator.leaderElection.enabled=true. Without leader election every replica reconciles every JsonnetSnippet independently, double-rendering and racing the ExternalArtifact write. Keep leader election on, or pin replicas.min=replicas.max=1."
  - it: allows scaling the operator with leader election on (default)
    set:
      operator.enabled: true
      operator.defaultServiceAccount: default
      operator.storage.backend: s3
      operator.storage.s3.endpoint: minio.minio.svc:9000
      operator.storage.s3.bucket: jaas
      replicas.max: 3
    asserts:
      - hasDocuments:
          count: 0
  # Egress guard — operator egress that cannot reach the apiserver wedges the operator
  - it: rejects operator egress on the kubernetes engine with no apiserver CIDRs
    set:
      operator.enabled: true
      operator.defaultServiceAccount: default
      networkPolicy.enabled: true
      networkPolicy.egress.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "networkPolicy.engine=kubernetes with operator.enabled and networkPolicy.egress.enabled requires networkPolicy.egress.kubernetesAPI.ipBlocks: networking.k8s.io/v1 can select the kube-apiserver neither by label nor by entity, so its endpoint addresses have to be named as CIDRs. Read them — and the endpoint port for networkPolicy.egress.kubernetesAPI.port, which is usually 6443 rather than the 443 the Service publishes — from `kubectl --namespace default get endpoints kubernetes`. The calico and cilium engines resolve the apiserver themselves and need no CIDR."
  - it: allows operator egress on the kubernetes engine once the apiserver CIDRs are set
    set:
      operator.enabled: true
      operator.defaultServiceAccount: default
      networkPolicy.enabled: true
      networkPolicy.egress.enabled: true
      networkPolicy.egress.kubernetesAPI.ipBlocks:
        - 10.0.0.1/32
    asserts:
      - hasDocuments:
          count: 0
  - it: allows operator egress on the calico engine with no CIDRs at all
    set:
      operator.enabled: true
      operator.defaultServiceAccount: default
      networkPolicy.enabled: true
      networkPolicy.engine: calico
      networkPolicy.egress.enabled: true
    asserts:
      - hasDocuments:
          count: 0
  - it: names the engine's own list when the apiserver rule is switched off
    set:
      operator.enabled: true
      operator.defaultServiceAccount: default
      networkPolicy.enabled: true
      networkPolicy.engine: calico
      networkPolicy.egress.enabled: true
      networkPolicy.egress.kubernetesAPI.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "operator.enabled with networkPolicy.egress.enabled, networkPolicy.egress.kubernetesAPI.enabled=false and an empty networkPolicy.calico.egress denies the operator's egress to the kube-apiserver, so its cache never syncs and it never becomes ready — only cluster DNS is auto-allowed. Re-enable networkPolicy.egress.kubernetesAPI.enabled, or admit the apiserver (plus source-controller and any S3/OTLP endpoints) through networkPolicy.calico.egress, or set networkPolicy.egress.enabled=false."
  - it: accepts a hand-written apiserver rule in the engine's own list
    set:
      operator.enabled: true
      operator.defaultServiceAccount: default
      networkPolicy.enabled: true
      networkPolicy.engine: calico
      networkPolicy.egress.enabled: true
      networkPolicy.egress.kubernetesAPI.enabled: false
      networkPolicy.calico.egress:
        - action: Allow
          destination:
            services:
              name: kubernetes
              namespace: default
    asserts:
      - hasDocuments:
          count: 0
  - it: allows the operator with egress disabled (default)
    set:
      operator.enabled: true
      operator.defaultServiceAccount: default
      networkPolicy.enabled: true
    asserts:
      - hasDocuments:
          count: 0
  - it: allows egress with an empty egress.to outside operator mode
    set:
      operator.enabled: false
      networkPolicy.enabled: true
      networkPolicy.egress.enabled: true
    asserts:
      - hasDocuments:
          count: 0
  # shutdownDelay must be whole seconds so the grace-period math is correct
  - it: rejects a sub-second shutdownDelay
    set:
      arguments.shutdownDelay: 500ms
    asserts:
      - failedTemplate:
          errorMessage: 'arguments.shutdownDelay must be a whole number of seconds like "5s" or "30s" (got "500ms"): the Deployment derives terminationGracePeriodSeconds from it by stripping the trailing "s", and a sub-second or minute form would silently collapse the grace period to the 65s floor.'
  - it: rejects a minute-form shutdownDelay
    set:
      arguments.shutdownDelay: 1m30s
    asserts:
      - failedTemplate:
          errorMessage: 'arguments.shutdownDelay must be a whole number of seconds like "5s" or "30s" (got "1m30s"): the Deployment derives terminationGracePeriodSeconds from it by stripping the trailing "s", and a sub-second or minute form would silently collapse the grace period to the 65s floor.'
  - it: allows a whole-seconds shutdownDelay
    set:
      arguments.shutdownDelay: 30s
    asserts:
      - hasDocuments:
          count: 0
