name: REUSE compliance
on:
  pull_request:
    branches: [main]
# Least privilege: the check only reads the tree (matches the other PR gates,
# which all drop the token to contents: read).
permissions:
  contents: read
jobs:
  reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/nix-devshell@d0c25fdb0d2c08f23bc62c867317a266b6f1a5c1 # 2026.9.12204255
      - run: nix develop --command reuse lint
